<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pdf-imza/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF İmza</title>
    <script>
      (() => {
        const addGetOrInsertComputed = (Ctor) => {
          if (!Ctor || Ctor.prototype.getOrInsertComputed) return;
          Object.defineProperty(Ctor.prototype, 'getOrInsertComputed', {
            configurable: true,
            writable: true,
            value(key, callback) {
              if (this.has(key)) return this.get(key);
              const value = callback(key);
              this.set(key, value);
              return value;
            }
          });
        };
        addGetOrInsertComputed(Map);
        addGetOrInsertComputed(WeakMap);

        const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'lineWidth');
        if (descriptor && descriptor.set && descriptor.get) {
          Object.defineProperty(CanvasRenderingContext2D.prototype, 'lineWidth', {
            get() { return descriptor.get.call(this); },
            set(value) {
              const nextValue = this.canvas && this.canvas.id === 'pad' && value === 3 ? 5 : value;
              descriptor.set.call(this, nextValue);
            }
          });
        }

        document.addEventListener('click', (event) => {
          const sendButton = event.target && event.target.closest && event.target.closest('#sendWhatsApp');
          if (!sendButton) return;
          const link = document.querySelector('.linkBox')?.textContent?.trim();
          if (!link) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const message = `Merhaba, imzalamanız gereken belge için bu bağlantıyı açabilir misiniz?\n${link}`;
          location.href = `https://wa.me/?text=${encodeURIComponent(message)}`;
        }, true);

        const originalOpen = window.open.bind(window);
        window.open = function(url, target, features) {
          const text = String(url || '');
          if (!text.startsWith('https://wa.me/?text=')) {
            return originalOpen(url, target, features);
          }

          const decoded = decodeURIComponent(text.split('text=')[1] || '');
          const pdfUrl = decoded.match(/https?:\/\/\S+\.pdf(?:\?\S*)?/i)?.[0];
          if (!pdfUrl || !navigator.share || !navigator.canShare) {
            return originalOpen(url, target, features);
          }

          (async () => {
            try {
              const response = await fetch(pdfUrl);
              if (!response.ok) throw new Error('PDF indirilemedi');
              const blob = await response.blob();
              const file = new File([blob], 'imzali-belge.pdf', { type: 'application/pdf' });
              if (navigator.canShare({ files: [file] })) {
                await navigator.share({
                  files: [file],
                  title: 'İmzalı PDF',
                  text: 'İmzalı PDF ektedir.'
                });
                return;
              }
            } catch (error) {
              console.warn('PDF dosya paylaşımı kullanılamadı, link ile devam ediliyor.', error);
            }
            originalOpen(url, target, features);
          })();

          return null;
        };
      })();
    </script>
    <style>.pdf-step-number{display:inline-block;margin-right:6px;padding:2px 7px;background:#0f8191;color:#fff;border-radius:7px;font-weight:900;font-size:13px;vertical-align:middle}</style>
    <script>
    (() => {
      const normalize = s => String(s||"").toLocaleLowerCase("tr-TR").replace(/\s+/g," ").trim();
      function stepFor(el) {
        const id=normalize(el.id),label=normalize(el.innerText||el.textContent),all=id+" "+label;
        if(id==="sendwhatsapp"||all.includes("whatsapp"))return "4";
        if(all.includes("kopyala")&&(all.includes("link")||all.includes("bağlantı")))return "4";
        if(all.includes("link oluştur")||all.includes("bağlantı oluştur")||all.includes("link üret"))return "3";
        if(all.includes("imza alan")||all.includes("alan seç"))return "2";
        if(all.includes("pdf yükle")||all.includes("pdf dosyası")||all.includes("dosya yükle")||all.includes("dosya seç"))return "1";
        return null;
      }
      function applyNumbers(){
        document.querySelectorAll('#app button,#app label,#app [role="button"]').forEach(el=>{
          if(el.dataset.pdfStepDone)return;
          const n=stepFor(el);
          if(!n)return;
          el.dataset.pdfStepDone="1";
          const badge=document.createElement("span");
          badge.className="pdf-step-number";badge.textContent=n+".";
          el.insertBefore(badge,el.firstChild);
        });
      }
      document.addEventListener("DOMContentLoaded",()=>{
        applyNumbers();
        new MutationObserver(applyNumbers).observe(document.getElementById("app"),{childList:true,subtree:true});
      });
    })();
    </script>
    <script type="module" crossorigin src="/pdf-imza/assets/index-W37B-N9h.js?v=2314"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
