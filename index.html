<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pdf-imza/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF İmza</title>
    <script>
      (() => {
        const addGetOrInsertComputed = (Ctor) => {
          if (!Ctor || Ctor.prototype.getOrInsertComputed) return;
          Object.defineProperty(Ctor.prototype, 'getOrInsertComputed', {
            configurable: true,
            writable: true,
            value(key, callback) {
              if (this.has(key)) return this.get(key);
              const value = callback(key);
              this.set(key, value);
              return value;
            }
          });
        };
        addGetOrInsertComputed(Map);
        addGetOrInsertComputed(WeakMap);

        const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'lineWidth');
        if (descriptor && descriptor.set && descriptor.get) {
          Object.defineProperty(CanvasRenderingContext2D.prototype, 'lineWidth', {
            get() { return descriptor.get.call(this); },
            set(value) {
              const nextValue = this.canvas && this.canvas.id === 'pad' && value === 3 ? 5 : value;
              descriptor.set.call(this, nextValue);
            }
          });
        }

        document.addEventListener('click', (event) => {
          const sendButton = event.target && event.target.closest && event.target.closest('#sendWhatsApp');
          if (!sendButton) return;
          const link = document.querySelector('.linkBox')?.textContent?.trim();
          if (!link) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const message = `Merhaba, imzalamanız gereken belge için bu bağlantıyı açabilir misiniz?\n${link}`;
          location.href = `https://wa.me/?text=${encodeURIComponent(message)}`;
        }, true);

        const originalOpen = window.open.bind(window);
        window.open = function(url, target, features) {
          const text = String(url || '');
          if (!text.startsWith('https://wa.me/?text=')) {
            return originalOpen(url, target, features);
          }

          const decoded = decodeURIComponent(text.split('text=')[1] || '');
          const pdfUrl = decoded.match(/https?:\/\/\S+\.pdf(?:\?\S*)?/i)?.[0];
          if (!pdfUrl || !navigator.share || !navigator.canShare) {
            return originalOpen(url, target, features);
          }

          (async () => {
            try {
              const response = await fetch(pdfUrl);
              if (!response.ok) throw new Error('PDF indirilemedi');
              const blob = await response.blob();
              const file = new File([blob], 'imzali-belge.pdf', { type: 'application/pdf' });
              if (navigator.canShare({ files: [file] })) {
                await navigator.share({
                  files: [file],
                  title: 'İmzalı PDF',
                  text: 'İmzalı PDF ektedir.'
                });
                return;
              }
            } catch (error) {
              console.warn('PDF dosya paylaşımı kullanılamadı, link ile devam ediliyor.', error);
            }
            originalOpen(url, target, features);
          })();

          return null;
        };
      })();
    </script>
    <style>
      .pdf-step-label::before {content:attr(data-step-no) ". ";font-weight:800}
    </style>
    <script>
      (() => {
        const rules = [
          [/^(?:pdf\s*(?:dosyas[ıi]n[ıi]?)?\s*y[uü]kle|dosya\s*se[cç])/i, "1"],
          [/^(?:[iİ]mza\s*alan[ıi]\s*se[cç]|alan\s*se[cç])/i, "2"],
          [/^(?:link|ba[gğ]lant[ıi])\s*olu[sş]tur/i, "3"],
          [/^(?:link|ba[gğ]lant[ıi])\s*kopyala/i, "4"],
          [/^(?:whatsapp(?:['’]tan|\s*(?:ile|[uü]zerinden))?\s*(?:g[oö]nder|payla[sş])|whatsapp'a\s*g[oö]nder)/i, "4"]
        ];
        function numberExistingLabels() {
          document.querySelectorAll('button,label,[role="button"]').forEach(el => {
            if (el.closest('.pdf-step-label')) return;
            const label = (el.innerText || el.textContent || '').trim().replace(/\s+/g, ' ');
            const rule = rules.find(([regex]) => regex.test(label));
            if (rule) {
              el.dataset.stepNo = rule[1];
              el.classList.add('pdf-step-label');
            }
          });
        }
        document.addEventListener('DOMContentLoaded', () => {
          numberExistingLabels();
          new MutationObserver(numberExistingLabels).observe(document.querySelector('#app') || document.body, {subtree:true,childList:true});
        });
      })();
    </script>
    <script type="module" crossorigin src="/pdf-imza/assets/index-W37B-N9h.js?v=2314"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
